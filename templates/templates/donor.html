<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Donor Registration - Smart Blood Bank
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .form-container {
            max-width: 550px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-container h1 {
            text-align: center;
            color: #b30000;
        }

        .form-container p {
            text-align: center;
            color: #666;
        }

        .form-container label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-container input,
        .form-container select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-container button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #b30000;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-container button:hover {
            background: #800000;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b30000;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <!-- ===================== NAVBAR ===================== -->

    <nav class="navbar">

        <div class="navbar-container">


            <!-- LOGO -->

            <a href="/" class="navbar-logo">

                🩸 Smart Blood Bank

            </a>


            <!-- MOBILE MENU BUTTON -->

            <button
                class="navbar-toggle"
                onclick="toggleMenu()"
                aria-label="Toggle navigation">

                &#9776;

            </button>


            <!-- NAVIGATION LINKS -->

            <ul class="navbar-links" id="navLinks">


                <!-- HOME -->

                <li>

                    <a href="/">

                        Home

                    </a>

                </li>


                <!-- DONOR REGISTRATION -->

                <li>

                    <a href="{{ url_for('donor') }}">

                        Donor Registration

                    </a>

                </li>


                <!-- BLOOD REQUEST -->

                <li>

                    <a href="{{ url_for('request_blood') }}">

                        Blood Request

                    </a>

                </li>


                <!-- HOSPITAL REGISTRATION -->

                <li>

                    <a href="{{ url_for('hospital') }}">

                        Hospital Registration

                    </a>

                </li>


                <!-- HOSPITAL LOGIN -->

                <li>

                    <a href="{{ url_for('hospital_login') }}">

                        Hospital Login

                    </a>

                </li>


                <!-- ADMIN DASHBOARD -->

                <li>

                    <a href="{{ url_for('admin') }}">

                        Admin Dashboard

                    </a>

                </li>


                <!-- ADMIN LOGIN -->

                <li>

                    <a href="{{ url_for('login') }}">

                        Login

                    </a>

                </li>


            </ul>

        </div>

    </nav>



    <!-- ===================== DONOR FORM ===================== -->

    <div class="form-container">


        <h1>

            🧑‍🤝‍🧑 Donor Registration

        </h1>


        <p>

            Register yourself as a blood donor

        </p>



        <form
            method="POST"
            action="{{ url_for('donor') }}">


            <!-- FULL NAME -->

            <label for="name">

                Full Name

            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >



            <!-- EMAIL -->

            <label for="email">

                Email

            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >



            <!-- PHONE -->

            <label for="phone">

                Phone Number

            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
            >



            <!-- BLOOD GROUP -->

            <label for="blood_group">

                Blood Group

            </label>

            <select
                id="blood_group"
                name="blood_group"
                required>

                <option value="">

                    Select Blood Group

                </option>

                <option value="A+">
                    A+
                </option>

                <option value="A-">
                    A-
                </option>

                <option value="B+">
                    B+
                </option>

                <option value="B-">
                    B-
                </option>

                <option value="AB+">
                    AB+
                </option>

                <option value="AB-">
                    AB-
                </option>

                <option value="O+">
                    O+
                </option>

                <option value="O-">
                    O-
                </option>

            </select>



            <!-- CITY -->

            <label for="city">

                City

            </label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >



            <!-- SUBMIT -->

            <button type="submit">

                🩸 Register as Donor

            </button>


        </form>



        <!-- BACK TO HOME -->

        <a href="/" class="back-home">

            ← Back to Home

        </a>


    </div>



    <!-- ===================== MOBILE MENU ===================== -->

    <script>

        function toggleMenu() {

            var links =
                document.getElementById("navLinks");

            links.classList.toggle("active");

        }

    </script>


</body>

</html>
